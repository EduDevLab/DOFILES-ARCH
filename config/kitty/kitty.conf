# ─────────────────────────────────────
# Nord — Kitty
# ─────────────────────────────────────

# Fuente
# JetBrains Mono Nerd Font Mono en Thin (glifos Nerd para starship).
# El bold real se conserva en la variante bold_font.
font_family      family="JetBrainsMono Nerd Font Mono" style=Thin
bold_font        family="JetBrainsMono Nerd Font Mono" style=Bold
italic_font      family="JetBrainsMono Nerd Font Mono" style="Thin Italic"
bold_italic_font family="JetBrainsMono Nerd Font Mono" style="Bold Italic"
font_size 14

# Cursor
cursor_shape beam
cursor_blink_interval 0.5

# ─────────────────────────────────────
# Transparencia
# ─────────────────────────────────────

background_opacity 0.80

# Shell por defecto (zsh)
env SHELL=/usr/bin/zsh
shell /usr/bin/zsh
# No mostrar barra de título
hide_window_decorations yes

# ─────────────────────────────────────
# Padding
# ─────────────────────────────────────

window_padding_width 10 12

# ─────────────────────────────────────
# Apariencia
# ─────────────────────────────────────

confirm_os_window_close 0
enable_audio_bell no

# Tabs
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted

# Control remoto para recarga en vivo (SIGUSR1 / kitty @)
allow_remote_control yes

# ─── TEMA DINÁMICO (auto-generado desde el Wallpaper) ───
include current-theme.conf
