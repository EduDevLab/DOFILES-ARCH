# ==============================================================================
# YAZI CONFIGURATION - APPS PREDETERMINADAS Y APERTURA (Yazi 26.x Schema)
# ==============================================================================

[mgr]
ratio          = [1, 3, 4]
sort_by        = "alphabetical"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
linemode       = "size"
show_hidden    = true
show_symlink   = true

[preview]
tab_size      = 2
max_width     = 1200
max_height    = 1000
image_filter  = "triangle"
image_quality = 80

# ------------------------------------------------------------------------------
# DEFINICIÓN DE APLICACIONES (OPENERS - Sintaxis %s / %s1 de Yazi 26.x)
# ------------------------------------------------------------------------------
[opener]
edit = [
    { run = "nvim %s", block = true, desc = "Neovim", for = "unix" },
]
code = [
    { run = "code %s", orphan = true, desc = "Visual Studio Code", for = "unix" },
]
pdf = [
    { run = "chromium %s1", orphan = true, desc = "Chromium", for = "unix" },
]
markdown = [
    { run = "obsidian %s1", orphan = true, desc = "Obsidian", for = "unix" },
]
open = [
    { run = "xdg-open %s1", desc = "Abrir con app predeterminada", for = "linux" },
]

# ------------------------------------------------------------------------------
# REGLAS DE ASOCIACIÓN DE ARCHIVOS
# ------------------------------------------------------------------------------
[open]
rules = [
    # Carpetas
    { mime = "folder/*", use = [ "edit", "open" ] },
    { url = "*/", use = [ "edit", "open" ] },

    # Archivos PDF -> Chromium
    { mime = "application/pdf", use = [ "pdf", "open" ] },
    { url = "*.pdf", use = [ "pdf", "open" ] },

    # Archivos Markdown (.md) -> Obsidian
    { mime = "text/markdown", use = [ "markdown", "edit", "code", "open" ] },
    { url = "*.md", use = [ "markdown", "edit", "code", "open" ] },
    { url = "*.markdown", use = [ "markdown", "edit", "code", "open" ] },

    # Código y archivos de configuración -> Opciones: Neovim y VS Code
    { mime = "text/*", use = [ "edit", "code", "open" ] },
    { mime = "inode/empty", use = [ "edit", "code", "open" ] },
    { mime = "application/{json,ndjson,javascript,typescript,xml,x-sh,x-shellscript,toml,yaml}", use = [ "edit", "code", "open" ] },

    # Extensiones de programación comunes
    { url = "*.{py,js,ts,jsx,tsx,html,css,scss,rs,go,c,cpp,h,hpp,lua,sh,bash,zsh,json,jsonc,yaml,yml,toml,ini,conf,cfg,sql}", use = [ "edit", "code", "open" ] },

    # Resto de archivos -> Apertura con app predeterminada del sistema
    { url = "*", use = [ "open" ] },
]
